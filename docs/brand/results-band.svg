<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Wrong money moved: 0 of 270 attack runs with Counterfoil, 99 of 270 with no gate; 82% of genuine requests still handled right; 9 AI models tested">
  <!-- The dashboard's results band, in the site's palette: espresso, orange, lilac, powder blue. Numbers exported 26 Oct 2026. -->
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .n { font-size: 68px; font-weight: 600; letter-spacing: -2px; }
    .d { font-size: 28px; font-weight: 500; opacity: .75; }
    .c { font-size: 16px; }
    .ink { fill: #2d1e19; }
    .cream { fill: #fbf7f2; }
  </style>
  <rect x="0" y="0" width="300" height="250" fill="#2d1e19"/>
  <rect x="300" y="0" width="300" height="250" fill="#e98a3a"/>
  <rect x="600" y="0" width="300" height="250" fill="#e4a1f5"/>
  <rect x="900" y="0" width="300" height="250" fill="#c5d0e6"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 6">
    <rect x="8" y="8" width="284" height="234"/>
    <rect x="308" y="8" width="284" height="234"/>
    <rect x="608" y="8" width="284" height="234"/>
    <rect x="908" y="8" width="284" height="234"/>
  </g>
  <g class="cream">
    <text x="28" y="98" class="n">0<tspan class="d">/270</tspan></text>
    <text x="28" y="186" class="c">attack runs where wrong</text>
    <text x="28" y="210" class="c">money moved, with Counterfoil</text>
  </g>
  <g class="ink">
    <text x="328" y="98" class="n">99<tspan class="d">/270</tspan></text>
    <text x="328" y="186" class="c">the same attacks</text>
    <text x="328" y="210" class="c">with no gate</text>
    <text x="628" y="98" class="n">82%</text>
    <text x="628" y="186" class="c">genuine requests</text>
    <text x="628" y="210" class="c">still handled right</text>
    <text x="928" y="98" class="n">9</text>
    <text x="928" y="186" class="c">AI models tested,</text>
    <text x="928" y="210" class="c">local and cloud</text>
  </g>
</svg>
