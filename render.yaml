# Render Blueprint for the live demo and the dashboard (New → Blueprint → this repo). Replay mode works with no env vars.
# The hackathon rules ask for the project to stay reachable until judging ends (15 Dec 2026), so the demo runs on a paid
# instance that does not sleep; the dashboard is a static site, which Render serves without sleeping.
# Values marked sync: false are entered in the Render dashboard and never committed.
services:
  - type: web
    name: counterfoil-demo
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # live mode: a counterfoil.llm preset name (e.g. haiku-5.5) plus that preset's key
      - key: DEMO_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # abuse limits (defaults shown)
      - key: DEMO_DAILY_LLM_CALLS
        value: "300"
      - key: DEMO_RATE_LIMIT
        value: "6"
      - key: DEMO_RATE_WINDOW_S
        value: "600"
      # optional: real Braintree sandbox instead of the in-memory rail (all four must be set)
      - key: BRAINTREE_ENVIRONMENT
        value: sandbox
      - key: BRAINTREE_MERCHANT_ID
        sync: false
      - key: BRAINTREE_PUBLIC_KEY
        sync: false
      - key: BRAINTREE_PRIVATE_KEY
        sync: false
      # optional: id of a USD merchant account (the sandbox's default account may settle in another currency)
      - key: BRAINTREE_MERCHANT_ACCOUNT_ID
        sync: false

  - type: web
    name: counterfoil-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      # optional: AG Studio licence key; without it Studio shows a watermark
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE
        sync: false
